[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "playlistdrop-api"
version = "0.1.0"
description = "FastAPI backend for PlaylistDrop — resolves Apple Music playlists and matches free Creative Commons audio catalogs."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "httpx>=0.28.1",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.1",
    "structlog>=24.4.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "ruff>=0.9.1",
    "mypy>=1.14.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
